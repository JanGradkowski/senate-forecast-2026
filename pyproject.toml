[project]
name = "senate-forecast-2026"
version = "0.1.0"
description = "2026 US Senate race forecaster (model 1) and prediction-market allocator (model 2)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # data
    "numpy",
    "pandas",
    "pyarrow",
    "httpx",
    "python-dotenv",
    "pyyaml",
    "tqdm",
    # model 1: forecaster
    "scipy",
    "scikit-learn",
    "statsmodels",
    "lightgbm",
    # model 2: allocator
    "cvxpy",
    # analysis
    "matplotlib",
    "ipykernel",
    "lxml>=6.1.3",
    "tabulate>=0.10.0",
]

[project.optional-dependencies]
# Hierarchical Bayesian variant of model 1 (heavier install, optional)
bayes = ["pymc", "arviz"]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/senate_forecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["ISC004"]

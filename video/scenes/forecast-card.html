<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Forecast card</title>
  <link rel="stylesheet" href="/video/lib/inter.css">
  <link rel="stylesheet" href="/gui/styles.css">
  <link rel="stylesheet" href="common.css">
  <script src="/video/node_modules/d3/dist/d3.min.js"></script>
  <style>
    .title { font-size: 128px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; margin: 0; }
  </style>
</head>
<body>
<script type="module">
import { boot, el, place, show, prog, fmtInt } from "./common.js";

boot({
  duration: 2.6,
  async setup(data) {
    const asOf = d3.timeFormat("%-d %B %Y")(d3.timeParse("%d %b %Y")(data.as_of));
    const kicker = place(el("p", "v-kicker", `Model run of ${asOf}`), 120, 372);
    const title = place(el("h1", "title", "The forecast"), 120, 420);
    const sub = place(el("p", "v-body", `All ${data.races.length} races, filled in from the safest to the closest`), 120, 572);
    return {
      cues: [
        { t: 0.2, type: "swell", dur: 1.2, f: 350, gain: 0.6 },
        { t: 0.4, type: "riser", dur: 1.9 },
      ],
      render(t) {
        show(kicker, prog(t, 0.15, 0.6));
        show(title, prog(t, 0.25, 0.7), 24);
        show(sub, prog(t, 0.5, 0.6));
      },
    };
  },
});
</script>
</body>
</html>

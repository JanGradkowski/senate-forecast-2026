<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Polls</title>
  <link rel="stylesheet" href="/video/lib/inter.css">
  <link rel="stylesheet" href="/gui/styles.css">
  <link rel="stylesheet" href="common.css">
  <script src="/video/node_modules/d3/dist/d3.min.js"></script>
  <style>
    .blk { width: 620px; }
    .blk .t { font-size: 34px; font-weight: 700; color: var(--ink); }
    .blk .d { font-size: 28px; color: var(--ink-2); line-height: 1.35; margin-top: 6px; }
    .tx { display: flex; align-items: baseline; gap: 18px; margin-top: 6px; }
    .tx .v-num { font-size: 112px; }
    .tx .u { font-size: 34px; font-weight: 600; color: var(--ink-2); }
    .avg { font-size: 48px; font-weight: 800; letter-spacing: -0.02em; margin-top: 4px; }
    .avg span { font-size: 30px; font-weight: 500; color: var(--ink-2); letter-spacing: 0; margin-left: 10px; }
  </style>
</head>
<body>
<script type="module">
import { boot, el, place, show, prog, svg, header, marginText, sideColor } from "./common.js";

boot({
  duration: 6.0,
  async setup(data) {
    const tau = data.polls.tau_days;
    const tx = data.blend.find((b) => b.postal === "TX");
    const head = header(2, "Polls are averaged, and recent polls count the most");

    // ---- recency weight exp(-age / tau)
    const L = 230, R = 1040, T = 360, B = 820, MAXD = 4 * tau;
    const x = d3.scaleLinear().domain([0, MAXD]).range([L, R]);
    const y = d3.scaleLinear().domain([0, 1]).range([B, T]);
    const s = svg();
    const axis = s.append("g");
    [0.5, 1].forEach((v) => axis.append("line").attr("class", "v-grid").attr("x1", L).attr("x2", R).attr("y1", y(v)).attr("y2", y(v)));
    axis.append("line").attr("class", "v-zero").attr("x1", L).attr("x2", R).attr("y1", B).attr("y2", B);
    [0, 1, 2, 3, 4].forEach((k) => axis.append("text").attr("class", "v-tick").attr("x", x(k * tau)).attr("y", B + 44).attr("text-anchor", "middle").text(k * tau));
    [[0, "0"], [0.5, "½"], [1, "full"]].forEach(([v, lbl]) => axis.append("text").attr("class", "v-tick").attr("x", L - 18).attr("y", y(v) + 10).attr("text-anchor", "end").text(lbl));
    axis.append("text").attr("class", "v-axis-title").attr("x", (L + R) / 2).attr("y", B + 100).attr("text-anchor", "middle").text("Age of the poll (days)");
    axis.append("text").attr("class", "v-axis-title").attr("x", 120).attr("y", T - 40).text("Weight in the average");

    const curve = d3.range(0, MAXD + 0.01, 0.25).map((d) => [d, Math.exp(-d / tau)]);
    const clip = s.append("clipPath").attr("id", "reveal").append("rect").attr("x", L - 10).attr("y", T - 20).attr("height", B - T + 40);
    const plot = s.append("g").attr("clip-path", "url(#reveal)");
    plot.append("path").attr("d", d3.area().x((d) => x(d[0])).y0(B).y1((d) => y(d[1]))(curve)).style("fill", "var(--d-lean)").attr("opacity", 0.28);
    plot.append("path").attr("d", d3.line().x((d) => x(d[0])).y((d) => y(d[1]))(curve)).attr("fill", "none").style("stroke", "var(--d-safe)").attr("stroke-width", 5);
    const formula = s.append("g").attr("opacity", 0);
    formula.append("line").attr("x1", x(tau)).attr("x2", x(tau)).attr("y1", y(Math.exp(-1))).attr("y2", B).style("stroke", "var(--ink-2)").attr("stroke-width", 2).attr("stroke-dasharray", "4 6");
    formula.append("circle").attr("cx", x(tau)).attr("cy", y(Math.exp(-1))).attr("r", 8).style("fill", "var(--d-safe)").style("stroke", "var(--surface)").attr("stroke-width", 3);
    formula.append("text").attr("class", "v-ann").attr("x", x(tau) + 70).attr("y", y(0.72)).text(`weight = exp(−age / ${tau} days)`);

    // ---- house effects, and Texas as the example
    const he = place(el("div", "blk"), 1180, 360);
    el("div", "t", "House effects removed", he);
    el("div", "d", `Each pollster’s lean is estimated and subtracted, shrunk toward zero (ridge, λ = ${data.polls.house_ridge}).`, he);
    const ex = place(el("div", "blk"), 1180, 560);
    el("div", "t", tx.state, ex);
    const row = el("div", "tx", null, ex);
    const n = el("div", "v-num", "0", row);
    el("div", "u", "polls", row);
    const avg = el("div", "avg", null, ex);
    avg.style.color = sideColor(tx.poll_avg);
    avg.innerHTML = `${marginText(tx.poll_avg, tx.party_nr)}<span>average</span>`;
    const note = place(el("p", "v-small"), 1180, 880, { width: "600px" });
    note.textContent = "Larger samples also count more; partisan polls count half.";

    return {
      render(t) {
        head.render(t);
        axis.attr("opacity", prog(t, 0.4, 0.6));
        clip.attr("width", (R - L + 20) * prog(t, 0.8, 1.3));
        formula.attr("opacity", prog(t, 1.9, 0.6));
        show(he, prog(t, 2.4, 0.6));
        show(ex, prog(t, 3.0, 0.6));
        n.textContent = Math.round(tx.n_polls * prog(t, 3.1, 1.2));
        show(avg, prog(t, 3.9, 0.6), 10);
        show(note, prog(t, 4.3, 0.6));
      },
    };
  },
});
</script>
</body>
</html>
